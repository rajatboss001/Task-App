<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task App</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
        --color-deep-red: #B40001;
        --color-gray: #81848A;

        --leading-119: 119%;

        --shadow-custom: 0px 11px 44px -10px #00000040;
    }
    </style>
</head>

<body>
    <section class="min-h-screen flex justify-center items-center">
        <div class="container max-w-[540px] w-full mx-auto">
            <h1 class="font-normal text-4xl text-center text-gray mb-[43px]">Task App</h1>
            <div class="row shadow-custom rounded-[20px] p-[23px_21px_28px_21px]">
                <div class="border border-black/10 rounded-[5px] flex gap-2 bg-white p-[7px_8px_7px_19px]">
                    <input id="todoInput" type="text" class="outline-none font-normal w-full leading-119 text-base"
                        placeholder="Add your task here...">
                    <button onclick="todoadd()"
                        class="addBtn cursor-pointer font-normal text-white py-[13px] rounded px-[34px] leading-119 text-base bg-[linear-gradient(97.42deg,#128DFF_-4.95%,#1444EF_109.04%)] max-w-[140px] w-full">Add
                        Task</button>
                </div>
                <div>
                    <p class="pt-[27px] pb-[9px]">Today’s tasks</p>
                    <ul class="task flex flex-col gap-1 max-h-[300px] overflow-y-auto">
                    </ul>
                </div>
            </div>
        </div>
    </section>
    <script>
        const todoInput = document.getElementById("todoInput")
        const task = document.querySelector(".task")

        const TASK_DATA = []
        function todoadd() {
            const inputValue = todoInput.value.trim();
            TASK_DATA.push(inputValue);
            todoInput.value = "";
            renderTask()
        }

        function renderTask() {
            task.innerHTML = TASK_DATA.map((task) =>
                `
                <li class="font-normal flex justify-between text-base hover:shadow-[0px_5px_17px_0px_#0000001A] pt-[22px] pb-[23px] border border-black/10 pl-[19px] pr-[16px]">
                    ${task}
                    <div class="flex gap-[15px]">
                        <button>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                              <g opacity="0.5">
                              <path d="M12 2C6.486 2 2 6.486 2 12C2 17.514 6.486 22 12 22C17.514 22 22 17.514 22 12C22 6.486 17.514 2 12 2ZM12 20C7.589 20 4 16.411 4 12C4 7.589 7.589 4 12 4C16.411 4 20 7.589 20 12C20 16.411 16.411 20 12 20Z" fill="black"/>
                              <path d="M9.99909 13.587L7.70009 11.292L6.28809 12.708L10.0011 16.413L16.7071 9.707L15.2931 8.293L9.99909 13.587Z" fill="black"/>
                              </g>
                            </svg>

                        </button>
                        <button>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g opacity="0.5">
                            <path d="M5 20C5 20.5304 5.21071 21.0391 5.58579 21.4142C5.96086 21.7893 6.46957 22 7 22H17C17.5304 22 18.0391 21.7893 18.4142 21.4142C18.7893 21.0391 19 20.5304 19 20V8H21V6H17V4C17 3.46957 16.7893 2.96086 16.4142 2.58579C16.0391 2.21071 15.5304 2 15 2H9C8.46957 2 7.96086 2.21071 7.58579 2.58579C7.21071 2.96086 7 3.46957 7 4V6H3V8H5V20ZM9 4H15V6H9V4ZM8 8H17V20H7V8H8Z" fill="black"/>
                            <path d="M9 10H11V18H9V10ZM13 10H15V18H13V10Z" fill="black"/>
                            </g>
                            </svg>


                        </button>
                    </div>
                </li>
                `
            ).join('')

        }
    </script>

</body>

</html>
